                    <span></span>

    <!-- 主内容区 -->
    <main class="problems-page-main">
        <div class="container">
            <div class="problems-page-header">
                <h1 class="problems-page-title">题库</h1>
                <p class="problems-page-subtitle">多平台算法题目精选，按平台、难度、分类筛选</p>
            </div>

            <!-- 平台切换 -->
            <div class="platform-tabs">
                <button class="platform-tab active" data-platform="all">全部</button>
                <button class="platform-tab" data-platform="leetcode">LeetCode</button>
                <button class="platform-tab" data-platform="codeforces">Codeforces</button>
                <button class="platform-tab" data-platform="nowcoder">牛客</button>
            </div>

            <!-- 筛选器 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="easy">🟢 简单</button>
                    <button class="filter-btn" data-filter="medium">🟡 中等</button>
                    <button class="filter-btn" data-filter="hard">🔴 困难</button>
                </div>
                <div class="filter-group">
                    <select id="category-filter" class="filter-select">
                        <option value="all">全部分类</option>
                        <option value="hash">哈希表</option>
                        <option value="two-pointers">双指针</option>
                        <option value="sliding-window">滑动窗口</option>
                        <option value="subarray">子串/子数组</option>
                        <option value="stack">栈</option>
                        <option value="linked-list">链表</option>
                        <option value="tree">二叉树</option>
                        <option value="graph">图论</option>
                        <option value="backtrack">回溯</option>
                        <option value="binary-search">二分查找</option>
                        <option value="dp">动态规划</option>
                        <option value="greedy">贪心</option>
                        <option value="heap">堆</option>
                        <option value="matrix">矩阵</option>
                        <option value="other">技巧</option>
                    </select>
                </div>
                <div class="search-box">
                    <input type="text" id="problem-search" placeholder="搜索题号或题目名称...">
                </div>
            </div>

            <!-- 题目统计 -->
            <div id="problems-stats" class="problems-stats"></div>

            <!-- 题目表格 -->
            <div class="problems-table-wrapper">
                <table class="problems-table">
                    <thead>
                        <tr>
                            <th>题号</th>
                            <th>题目</th>
                            <th>难度</th>
                            <th>分类</th>
                            <th>练习</th>
                            <th>教程</th>
                        </tr>
                    </thead>
                    <tbody id="problems-tbody">
                        <!-- JS 动态生成 -->
                    </tbody>
                </table>
            </div>

            <div class="problems-footer">
                <p id="problems-footer-text">加载中...</p>
            </div>
        </div>
    </main>

                        <li><a href="playground.html">在线刷题</a></li>

    <script src="assets/js/problems-data.js"></script>
    <script src="assets/js/problems.js"></script>
    <!-- Theme toggle -->
    <script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') || 'dark';
        }
        btn.addEventListener('click', function () {
            var next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('z2l-theme', next);
        });
    })();
    </script>
</body>

</html>
